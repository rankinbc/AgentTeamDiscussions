## 10 Open Design Questions for AgentTeamDiscussions
##
## These are unresolved questions that block implementation.
## Each is scoped to produce a concrete, actionable answer --
## not a philosophical discussion.

questions:

  1_user_input_to_session:
    title: "What does the user actually hand the system, and how does it become a session?"
    prompt: >
      The user has a product idea at 10 PM and wants to kick off an overnight
      session. Walk through exactly what happens. What does the user provide --
      plain text? A structured brief with fields? A YAML file? How minimal can
      it be ("a time tracker for freelancers") vs how detailed? Once submitted,
      what does the orchestrator do with that input to seed the first turn for
      each team? How does a vague one-liner become enough context for agents
      with specific stakeholder positions to have a meaningful first response?
      Design the input format, the seeding process, and the minimum viable
      input that produces a useful session.

  2_agent_turn_anatomy:
    title: "What happens inside a single agent turn, from trigger to output?"
    prompt: >
      An agent on Team A is about to take their turn. Walk through the full
      anatomy of that turn. What does the orchestrator assemble and send?
      Specifically: what goes in the system prompt (personality, position,
      technique, anti-slop rules -- how are these structured?), what goes
      in the user message (conversation history, cross-team messages, the
      current prompt or question, perspective reminder), and what constraints
      are placed on the output? Does the agent see the full team history or
      a compressed version? How does the orchestrator tell the agent what
      phase they're in and what's expected of them? What does the agent's
      raw output look like, and how does the orchestrator parse it into
      structured fields (the message content, any ideas generated, confidence
      signals, whether they're agreeing or disagreeing)? Design the full
      input/output contract for a single agent invocation.

  3_turn_sequencing:
    title: "Who speaks next and why?"
    prompt: >
      A team has 4-6 agents. Some are on the bench, some are active. The
      orchestrator needs to decide who speaks next. What's the algorithm?
      Is it round-robin among active agents? Relevance-based (who has the
      most to say about the current topic)? Random with weights? Does the
      orchestrator pick, or do agents volunteer? How does the bench system
      work concretely -- what triggers an agent to come off the bench or
      go onto it? When the Devil's Advocate duty rotates every 5 turns,
      is that 5 individual agent turns or 5 full rounds? What prevents
      one dominant agent from monopolizing the conversation? Design the
      turn-selection algorithm and bench activation rules with enough
      detail to implement.

  4_cross_team_message_flow:
    title: "How do messages actually flow between the two teams through the MCP server?"
    prompt: >
      Team A finishes a turn and produces a message intended for Team B.
      Trace the full path. How does the orchestrator decide this message
      should cross the team boundary (vs staying internal)? What format
      does it take in the MCP server? When Team B's orchestrator picks it
      up, how does it get injected into Team B's next turn -- as part of
      the conversation history? As a special "incoming message" block? Does
      Team B see a summary or the full message? Who writes the summary?
      What happens when 5 messages pile up before Team B gets to read them
      -- do they get batched? Prioritized? What's the MCP tool interface
      that each team's claude process actually calls to send and receive?
      Design the cross-team message flow end-to-end.

  5_context_lifecycle:
    title: "How does context get managed across a multi-hour overnight session?"
    prompt: >
      A session runs for 8 hours. Each claude -p call is stateless -- all
      context must be reconstructed. Early in the session, you can fit the
      full history in context. By hour 4, you can't. Walk through the
      context lifecycle. How is history stored on disk? When the orchestrator
      builds the next prompt, how does it decide what history to include?
      Is there a rolling window? A summarization step? When a phase
      transition happens, the spec says a briefing is generated for a
      context reset -- what goes in that briefing, who generates it, and
      does the team lose access to pre-briefing messages? How does an
      agent in hour 7 reference an idea from hour 1 that's no longer in
      their context window? Design the context management strategy from
      fresh session to context-full to phase-reset to session end.

  6_antislop_enforcement:
    title: "How are anti-slop mechanisms actually enforced at runtime?"
    prompt: >
      The design has 10 anti-slop mechanisms. Some are prompt-based
      (perspective enforcement, agreement tax -- just instructions in the
      system prompt). Others require runtime detection and intervention
      (convergence suppression, novelty scoring, surprise audits). For the
      runtime mechanisms: who runs them, when, and what happens when they
      trigger? Specifically -- convergence suppression needs to detect that
      agents are agreeing too quickly. How? The orchestrator parses output
      for agreement signals? A BackgroundAgent reviews every N turns? What
      does the intervention look like -- does the orchestrator modify the
      next agent's prompt ("the group is converging too fast, push back")?
      Inject a system message? Swap an agent? For novelty scoring -- how
      is similarity measured without embeddings infrastructure? Design the
      enforcement architecture: which mechanisms are prompt-only, which
      need runtime logic, what the detection and intervention patterns
      look like for each.

  7_phase_transitions:
    title: "How does the system decide to move from one phase to the next?"
    prompt: >
      The design says phases have exit gates (Brainstorm needs 50+ ideas
      with domain diversity, Refine needs all ideas challenged, etc.). But
      who evaluates whether a gate is met? The orchestrator can't count
      ideas without understanding what an "idea" is in unstructured agent
      output. Walk through a concrete Brainstorm-to-Refine transition.
      How does the system know it has 50 ideas? How does it measure domain
      diversity? Is this a BackgroundAgent task (Specter? Director?), an
      orchestrator heuristic, or a dedicated evaluation prompt? What
      happens if the gate isn't met but the phase has been running for 2
      hours -- is there a time-based override? When the transition fires,
      what changes concretely: new system prompts? Different anti-slop
      weights? Bench rotation? How is the transition communicated to the
      agents? Design the phase evaluation and transition mechanism.

  8_agentmind_schema:
    title: "What is AgentMind and how does it evolve during a session?"
    prompt: >
      AgentMind is referenced constantly in the design as the agent's
      internal state -- holding ideas with magnitude, mood, concerns. But
      it's never formally defined. Design the AgentMind schema. What fields
      does it contain? How does idea magnitude work -- what causes it to
      rise (agent defends it, others agree, research supports it) or fall
      (challenged successfully, superseded, ignored)? Is magnitude updated
      by the orchestrator parsing output, or does the agent self-report?
      How is mood tracked -- is it an explicit field the agent sets, or
      inferred from output tone? What persists between turns within a
      session? What persists between sessions? How does the orchestrator
      use AgentMind when assembling the next turn's prompt -- does the
      agent see their own mind state? Design the schema, update mechanics,
      and how AgentMind flows into prompt construction.

  9_overnight_resilience:
    title: "What does failure recovery look like for an 8-hour unattended session?"
    prompt: >
      It's 3 AM. The system has been running for 5 hours. Something goes
      wrong. Walk through the failure scenarios and recovery for each:
      (a) A claude CLI call times out or returns empty. (b) The MCP server
      crashes and restarts. (c) A team's context has degraded -- responses
      are getting repetitive and generic. (d) OAuth token refresh fails.
      (e) The orchestrator process itself crashes. For each: how is the
      failure detected, what state is preserved, and how does the system
      resume? Is there a checkpointing strategy (save full state every N
      turns)? Can a session resume from a checkpoint after a crash? What's
      the minimum state needed to resume? Design the failure detection,
      checkpointing, and recovery strategy.

  10_morning_brief_generation:
    title: "How does raw conversation become a useful Morning Brief?"
    prompt: >
      The session produced 200 turns of conversation across two teams, 4
      phase transitions, 30+ ideas, 8 decisions, and 2 unresolved
      disagreements. The user wakes up and needs a Morning Brief that's
      worth reading. How is this generated? Is it a single BackgroundAgent
      (Weaver) prompt that gets the full session history? A multi-pass
      process? How are items prioritized into tiers (FYI / needs input /
      needs decision / needs tiebreaker) -- is there an algorithm or is
      the LLM just asked to categorize? How are "highlights" (best
      exchanges, surprising ideas) identified and extracted? How are draft
      specs assembled from scattered conversation into coherent documents?
      What's the format of the Morning Brief -- markdown? Structured YAML
      the user reads? Both? Design the Morning Brief generation pipeline
      from raw session data to user-facing output.
