name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  engine:
    name: Engine (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _SYSTEM/projects/engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  ui:
    name: Dashboard (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _SYSTEM/projects/engine/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _SYSTEM/projects/engine/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  benchmark:
    name: Benchmark harness (offline tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _SYSTEM/projects/benchmark
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q
